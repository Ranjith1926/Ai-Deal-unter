# Production stack. Standalone file (do not layer it on docker-compose.yml):
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Exposure: only Caddy publishes ports (80/443). Postgres, Redis, the API and the MCP server stay on the
# private network. The browser talks to the Next.js app only (it proxies to the API server-side).
name: deal-hunter-prod

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-app: &app
  <<: *hardening
  env_file: .env.prod
  read_only: true
  tmpfs: ["/tmp"]

x-backend-build: &backend-build
  context: .
  dockerfile: infrastructure/docker/backend.Dockerfile

services:
  caddy:
    <<: *hardening
    image: caddy:2-alpine
    cap_add: [NET_BIND_SERVICE]
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS (your domain) in .env.prod}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 256M } } }

  frontend:
    <<: *app
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${SITE_ADDRESS}
    environment:
      INTERNAL_API_URL: http://backend:8000
    tmpfs: ["/tmp", "/app/.next/cache"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      backend: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 512M, cpus: "1.0" } } }

  backend:
    <<: *app
    build: *backend-build
    # --proxy-headers is deliberately off: the API reads X-Forwarded-For itself, gated by TRUSTED_PROXY_COUNT.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-server-header
    environment:
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live',timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 1G, cpus: "2.0" } } }

  # One-shot: applies Alembic migrations before the API and workers start.
  migrate:
    <<: *app
    restart: "no"
    build: *backend-build
    command: alembic upgrade head
    depends_on:
      postgres: { condition: service_healthy }

  celery-worker:
    <<: *app
    build: *backend-build
    working_dir: /srv/workers
    command: celery -A dh_workers.celery_app.celery_app worker --loglevel=INFO --concurrency=${CELERY_CONCURRENCY:-2}
    healthcheck:
      test: ["CMD-SHELL", "celery -A dh_workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME -t 5"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 1G, cpus: "2.0" } } }

  celery-beat:
    <<: *app
    build: *backend-build
    working_dir: /tmp
    command: celery -A dh_workers.celery_app.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 256M } } }

  mcp-server:
    <<: *app
    build:
      context: .
      dockerfile: infrastructure/docker/mcp.Dockerfile
    command: python -m dh_mcp.server --transport http
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8765"
    depends_on:
      backend: { condition: service_healthy }
    deploy: { resources: { limits: { memory: 256M } } }

  postgres:
    <<: *hardening
    image: postgres:16-alpine
    # The postgres entrypoint starts as root to fix volume ownership, then drops privileges, so it needs these.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dealhunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-dealhunter}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dealhunter} -d ${POSTGRES_DB:-dealhunter}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy: { resources: { limits: { memory: 1G } } }

  redis:
    <<: *hardening
    image: redis:7-alpine
    user: redis  # start unprivileged; the default entrypoint would need SETUID/SETGID to drop root itself
    # Persistence (AOF) keeps queued jobs and rate-limit state across restarts; noeviction protects the Celery queue.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { memory: 320M } } }

  # Nightly logical backup. Run on demand with:  docker compose -f docker-compose.prod.yml run --rm backup once
  backup:
    <<: *hardening
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/backup.sh"]
    command: ["loop"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-dealhunter}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-dealhunter}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./infrastructure/backup/backup.sh:/backup.sh:ro
      - backups:/backups
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  backups:
