# Optional monitoring add-on. Run together with the production stack so it shares the private network:
#   echo -n "$METRICS_TOKEN" > infrastructure/monitoring/metrics_token      (file is git-ignored)
#   docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml --env-file .env.prod up -d
# Prometheus is reachable on 127.0.0.1:9090 only; use an SSH tunnel to view it.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./infrastructure/monitoring/metrics_token:/etc/prometheus/metrics_token:ro
      - promdata:/prometheus
    depends_on: [backend]
    deploy: { resources: { limits: { memory: 512M } } }

volumes:
  promdata:
