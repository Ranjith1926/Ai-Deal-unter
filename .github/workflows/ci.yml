name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # weekly: new advisories can appear without any code change

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Postgres + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealhunter
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dealhunter
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dealhunter" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://dealhunter:ci-only-password@localhost:5432/dealhunter
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-jwt-secret-0123456789abcdef0123456789abcdef
      PYTHONPATH: ../workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt -r mcp-server/requirements.txt
      - name: Run tests
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Python advisories
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
          pip-audit -r mcp-server/requirements.txt
      - name: npm advisories (production dependencies)
        working-directory: frontend
        run: npm audit --omit=dev

  deploy-config:
    name: Validate deployment files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compose files parse with a complete environment
        run: |
          cp .env.prod.example .env.prod
          docker compose -f docker-compose.prod.yml --env-file .env.prod config --quiet
          touch infrastructure/monitoring/metrics_token
          docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml --env-file .env.prod config --quiet
      - name: Prometheus rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/infrastructure/monitoring:/etc/prometheus:ro" \
            prom/prometheus:v2.55.1 check rules /etc/prometheus/alerts.yml
      - name: Caddyfile
        run: |
          docker run --rm -e SITE_ADDRESS=localhost -v "$PWD/infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Shell scripts
        run: sh -n infrastructure/backup/backup.sh && sh -n infrastructure/backup/restore-check.sh
